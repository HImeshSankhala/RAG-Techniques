[project]
name = "rag-lab-backend"
version = "0.1.0"
description = "RAG Lab — FastAPI API + RAG engine for 9 retrieval-augmented generation techniques"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.140.13",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.1",
    # Engine (Phase 1). sentence-transformers pulls in torch, which is most of the
    # install time and disk footprint — the price of embedding locally for free.
    "anthropic==0.116.0",
    "chromadb==1.3.0",
    "sentence-transformers==5.1.2",
    # BM25 keyword retrieval (Phase 4). Pure Python + numpy, no index to persist.
    "rank_bm25==0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    # Starlette's TestClient wants httpx2 now; httpx 0.28 still works but warns.
    "httpx2==2.9.1",
    "ruff==0.14.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "implementations*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
