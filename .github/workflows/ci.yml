name: CI

# Pull requests only. Six PRs merged on local test runs alone before this existed;
# the point is to gate the merge, not to re-run the suite on every push to a branch.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    # One job, not two. `make lint` needs both toolchains anyway (ruff from the
    # Python venv, eslint and tsc from node_modules), so splitting backend and
    # frontend would duplicate the slow half of the setup to parallelise the fast
    # half.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          # frontend/package.json pins engines.node >=22.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `make index` embeds the corpus locally with sentence-transformers, which
      # downloads all-MiniLM-L6-v2 (~90MB) from the Hugging Face hub on first use.
      # No API key and no Ollama — this is the reason the suite can run at all in
      # a place with neither. Keyed on config.py because that is where the model
      # id lives; restore-keys means changing an unrelated setting re-uses the
      # download rather than re-fetching it.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('backend/core/config.py') }}
          restore-keys: hf-${{ runner.os }}-

      # `make setup` rather than hand-rolled install steps, so CI installs what a
      # human installs. It uses `npm install`, not `npm ci`: the trade-off is that
      # a lockfile out of step with package.json gets silently reconciled here
      # instead of failing, which is the price of not having two ways to install.
      - name: Install
        run: make setup PYTHON=${{ steps.python.outputs.python-path }}

      # pytest needs a populated Chroma collection: every pipeline test skips
      # itself when the index is empty (`require_index`), so without this step the
      # suite would go green having asserted nothing.
      - name: Build the index
        run: make index

      # Expected in CI: ~6 graph tests skip. backend/.graph.json is gitignored and
      # is built by an LLM extraction pass over the corpus, which needs Ollama —
      # so a fresh clone can never have one. Those skips already exist in
      # backend/tests/test_graph_rag.py; this workflow adds none of its own.
      #
      # Nothing here needs Ollama or ANTHROPIC_API_KEY. Every LLM call in the
      # suite is stubbed or intercepted, and the cost-guardrail tests supply their
      # own fake key. If a test ever fails in CI for a reason other than a missing
      # local service, that is a bug to fix, not a skip to add.
      - name: Test
        run: make test

      - name: Lint
        run: make lint
